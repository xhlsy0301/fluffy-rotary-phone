<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>liushiyi</title>
  <style>
    :html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    let width = 0, height = 0, dpr = 1, angle = 0;

    const rand = (a, b) => a + Math.random() * (b - a);

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    const tree = [];
    const ground = [];
    const stars = [];
    const heart = [];

    for (let i = 0; i < 12500; i++) {
      const u = Math.random();
      const h = u ** 1.6;
      let r = (1 - h) ** 1.1 * 3.2;
      const wave = Math.max(0, Math.sin((h * 5.8 + 0.15) * Math.PI * 2));
      r *= 1 + 0.65 * wave;
      const t = u * 9 * Math.PI * 2 + rand(-0.22, 0.22);
      r *= rand(0.85, 1.08);
      tree.push({ x: Math.cos(t) * r, y: 12 * h + 0.2, z: Math.sin(t) * r,
        c: i % 12 === 0 ? '#fff2c0' : i % 5 === 0 ? '#fff5da' : '#ffbde2' });
    }

    for (let i = 0; i < 4000; i++) {
      const ring = [4.6, 6, 7.4, 8.8, 10.2, 11.4][Math.floor(Math.random() * 6)];
      const r = rand(ring - 0.3, ring + 0.3);
      const t = Math.random() * Math.PI * 2;
      ground.push({ x: Math.cos(t) * r, y: -0.25, z: Math.sin(t) * r,
        c: Math.random() < 0.15 ? '#ecedff' : '#bbc5ff' });
    }

    for (let i = 0; i < 1200; i++) {
      stars.push({ x: rand(-18, 18), y: rand(3, 18), z: rand(-18, 18), c: '#dfe4ff' });
    }

    for (let i = 0; i < 1000; i++) {
      let x, y, f;
      do {
        x = rand(-1.3, 1.3);
        y = rand(-1.4, 1.4);
        f = (x*x + y*y - 1) ** 3 - x*x * y**3;
      } while (f > 0);
      heart.push({ x: x * 0.72, y: 12.05 + (y + 1) * 0.45, z: rand(-0.18, 0.18), c: '#ff9abe' });
    }

    function project(p) {
      const ca = Math.cos(angle), sa = Math.sin(angle);
      const xz = p.x * ca - p.z * sa;
      const zz = p.x * sa + p.z * ca;
      const pitch = -0.25;
      const yp = p.y * Math.cos(pitch) - zz * Math.sin(pitch);
      let zp = p.y * Math.sin(pitch) + zz * Math.cos(pitch) + 13;
      if (zp <= 0.1) return null;
      const f = (height * 0.63) / zp;
      return { x: width / 2 + xz * f, y: height / 2 - (yp - 6) * f, z: zp };
    }

    const flakes = Array.from({ length: 10 }, () => ({
      x: Math.random() * 1, y: Math.random() * 1.1 - 0.1,
      r: rand(0.004, 0.008), v: rand(0.00005, 0.00009)
    }));

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, width, height);

      const points = [];
      for (const p of [...tree, ...ground, ...stars, ...heart]) {
        const q = project(p);
        if (q) points.push({ ...q, c: p.c });
      }
      points.sort((a, b) => b.z - a.z);

      for (const p of points) {
        if (p.x >= 0 && p.x <= width && p.y >= 0 && p.y <= height) {
          const size = Math.max(0.7, 3.6 - p.z * 0.13);
          ctx.fillStyle = p.c;
          ctx.beginPath();
          ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 64px Georgia, "Times New Roman", serif';
      ctx.shadowColor = 'rgba(255,255,255,.85)';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#fff';
      ctx.fillText('liushiyi', width / 2, height * 0.14);
      ctx.restore();

      ctx.fillStyle = 'rgba(255,255,255,.9)';
      for (const f of flakes) {
        f.y += f.v;
        if (f.y > 1.08) { f.y = -0.08; f.x = Math.random(); }
        ctx.beginPath();
        ctx.arc(f.x * width, f.y * height, f.r * width, 0, Math.PI * 2);
        ctx.fill();
      }

      angle += 0.0045;
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    draw();
  </script>
</body>
</html>
