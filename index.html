<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>liushiyi — Merry Christmas</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="A glowing pink and golden Christmas tree with falling snow"></canvas>
  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d', { alpha: false });
    let width = 0, height = 0, dpr = 1, angle = 0;
    const rand = (a, b) => a + Math.random() * (b - a);

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    const tree = [], ground = [], stars = [], heart = [];
    for (let i = 0; i < 12500; i++) {
      const u = Math.random(), h = u ** 1.6;
      let r = (1 - h) ** 1.1 * 3.2;
      const wave = Math.max(0, Math.sin((h * 5.8 + 0.15) * Math.PI * 2));
      r *= 1 + 0.65 * wave;
      const t = u * 9 * Math.PI * 2 + rand(-0.22, 0.22);
      r *= rand(0.85, 1.08);
      tree.push({ x: Math.cos(t) * r, y: 12 * h + 0.2, z: Math.sin(t) * r,
        c: i % 12 === 0 ? '#fff2c0' : i % 5 === 0 ? '#fff5da' : '#ffbde2' });
    }
    for (let i = 0; i < 4000; i++) {
      const ring = [4.6, 6, 7.4, 8.8, 10.2, 11.4][Math.floor(Math.random() * 6)];
      const r = rand(ring - 0.3, ring + 0.3), t = Math.random() * Math.PI * 2;
      ground.push({ x: Math.cos(t) * r, y: -0.25, z: Math.sin(t) * r,
        c: Math.random() < 0.15 ? '#ecedff' : '#bbc5ff' });
    }
    for (let i = 0; i < 1200; i++)
      stars.push({ x: rand(-18, 18), y: rand(3, 18), z: rand(-18, 18), c: '#dfe4ff' });
    for (let i = 0; i < 1000; i++) {
      let x, y, f;
      do {
        x = rand(-1.3, 1.3); y = rand(-1.4, 1.4);
        f = (x*x + y*y - 1) ** 3 - x*x * y**3;
      } while (f > 0);
      heart.push({ x: x * 0.72, y: 12.05 + (y + 1) * 0.45, z: rand(-0.18, 0.18), c: '#ff9abe' });
    }

    function project(p) {
      const ca = Math.cos(angle), sa = Math.sin(angle);
      const xz = p.x * ca - p.z * sa, zz = p.x * sa + p.z * ca;
      const pitch = -0.25;
      const yp = p.y * Math.cos(pitch) - zz * Math.sin(pitch);
      const zp = p.y * Math.sin(pitch) + zz * Math.cos(pitch) + 13;
      if (zp <= 0.1) return null;
      const f = (height * 0.63) / zp;
      return { x: width / 2 + xz * f, y: height / 2 - (yp - 6) * f, z: zp };
    }

    const flakes = Array.from({ length: 90 }, () => ({
      x: Math.random(), y: Math.random(), r: rand(0.7, 2.2),
      v: rand(0.25, 0.8), drift: rand(-0.25, 0.25)
    }));

    function drawText() {
      const firstSize = Math.min(64, Math.max(28, width * 0.105), height * 0.075);
      const secondSize = Math.min(40, Math.max(17, width * 0.067), height * 0.052);
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(255,220,240,.95)';
      ctx.shadowBlur = Math.max(8, Math.min(18, width * 0.035));
      ctx.fillStyle = '#fff';
      ctx.font = 'bold ' + firstSize + 'px Georgia, "Times New Roman", serif';
      ctx.fillText('liushiyi', width / 2, Math.max(34, height * 0.115));
      ctx.shadowColor = 'rgba(255,245,220,.9)';
      ctx.shadowBlur = 14;
      ctx.font = 'bold ' + secondSize + 'px Georgia, "Times New Roman", serif';
      ctx.fillText('Merry Christmas', width / 2, Math.max(68, height * 0.19));
      ctx.restore();
    }

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, width, height);
      const points = [];
      for (const p of [...tree, ...ground, ...stars, ...heart]) {
        const q = project(p);
        if (q) points.push({ ...q, c: p.c });
      }
      points.sort((a, b) => b.z - a.z);
      for (const p of points) {
        if (p.x >= 0 && p.x <= width && p.y >= 0 && p.y <= height) {
          ctx.fillStyle = p.c;
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(0.7, 3.6 - p.z * 0.13), 0, Math.PI * 2);
          ctx.fill();
        }
      }
      drawText();
      ctx.fillStyle = 'rgba(255,255,255,.82)';
      for (const f of flakes) {
        f.y += f.v / Math.max(height, 1);
        f.x += f.drift / Math.max(width, 1);
        if (f.y > 1.03) { f.y = -0.03; f.x = Math.random(); }
        if (f.x > 1.02) f.x = -0.02;
        if (f.x < -0.02) f.x = 1.02;
        ctx.beginPath();
        ctx.arc(f.x * width, f.y * height, f.r, 0, Math.PI * 2);
        ctx.fill();
      }
      angle += 0.0045;
      requestAnimationFrame(draw);
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();
    draw();
  </script>
</body>
</html>
